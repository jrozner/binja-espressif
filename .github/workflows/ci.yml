name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      # Without the `core` feature, binaryninjacore-sys builds a stub core
      # library with CMake and Ninja in place of a Binary Ninja install.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --no-default-features --all-targets

      # The lift_sweep integration test needs a licensed Binary Ninja core, so
      # only the unit tests run here.
      - name: Test
        run: cargo test --no-default-features --lib

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings
