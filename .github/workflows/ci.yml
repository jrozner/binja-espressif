name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Without the `core` feature, binaryninjacore-sys builds a stub core library
# with CMake and Ninja (both on the runner image) in place of a Binary Ninja
# install.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Build
        run: cargo build --no-default-features --all-targets

      # The lift_sweep integration test needs a licensed Binary Ninja core, so
      # only the unit tests run here.
      - name: Test
        run: cargo test --no-default-features --lib

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings
