version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Tracks the Binary Ninja API dev branch; bump these by hand to match
      # the installed Binary Ninja version.
      - dependency-name: "binaryninja"
      - dependency-name: "binaryninjacore-sys"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
