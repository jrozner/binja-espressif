# Builds and publishes the prebuilt native libraries that the Python loader
# (binja_xtensa_loader/) installs. Manual only (workflow_dispatch), in two
# runs, because a tag's source cannot contain the hashes of libraries built
# from that same tag:
#
# 1. mode=build, dispatched on a branch (normally main). Builds the
#    libraries of the dispatched commit for Linux, Windows and macOS
#    (universal) against the stable binaryninja-api release named in
#    scripts/use_stable_api.sh, uploads them as workflow artifacts, and
#    generates the loader's manifest: version, build commit, this run's ID,
#    and each library's name, core ABI, size and SHA-256. The manifest is
#    shown in the run summary and uploaded as the `manifest` artifact.
#
# 2. The maintainer commits that manifest as binja_xtensa_loader/manifest.json
#    on top of the build commit (with plugin.json's version bumped, if it
#    wasn't already), and pushes a v<version> tag on that commit.
#
# 3. mode=publish, dispatched on that tag. Checks that plugin.json and the
#    committed manifest are for the tag, that the run named by the manifest
#    built the commit the manifest names, and that the tag's tree equals
#    that commit's apart from the manifest and plugin.json's version. It then
#    downloads that run's artifacts, checks them against the committed
#    manifest, and creates the release from exactly those files.
#
# The loader verifies every download against the manifest in the source the
# extension manager installed (the tag's), never against anything fetched
# from the release.
#
# Assets, one per platform and core ABI:
#
#   binja_xtensa-abi<N>-linux-x86_64.so
#   binja_xtensa-abi<N>-windows-x86_64.dll
#   binja_xtensa-abi<N>-macos-universal.dylib
#
# The builds link a stub core generated by binaryninjacore-sys (the `core`
# feature is off), so no Binary Ninja installation or serial is needed. The
# stub has the real core's library name (libbinaryninjacore.so.1,
# binaryninjacore.dll, @rpath/libbinaryninjacore.1.dylib), and Binary Ninja
# loads its core before any plugin, so the plugin binds to the real core.

name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build: build the dispatched commit and generate the manifest. publish: publish the dispatched tag's release from its manifest's build run."
        required: true
        type: choice
        options:
          - build
          - publish
      version:
        description: "build only: the version being released (default: plugin.json's version), e.g. 0.2.0"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: inputs.mode == 'build'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            targets: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x86_64
            targets: x86_64-pc-windows-msvc
          # Both slices are built on the Apple silicon runner and joined
          # into one universal dylib.
          - os: macos-latest
            platform: macos-universal
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      # The dispatched commit, pinned by SHA so every job builds the same one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        shell: bash
        run: |
          rustup update stable --no-self-update && rustup default stable
          for target in ${{ matrix.targets }}; do rustup target add "$target"; done

      # The stub core is built with CMake (on every runner image) and Ninja;
      # bindgen needs libclang (on every runner image).
      - name: Install Ninja
        shell: bash
        run: |
          if ! command -v ninja >/dev/null; then
            case "$RUNNER_OS" in
              macOS) brew install ninja ;;
              Windows) choco install ninja --no-progress -y ;;
              Linux) sudo apt-get update && sudo apt-get install -y ninja-build ;;
            esac
          fi
          ninja --version

      # Release binaries target the stable Binary Ninja, not the dev API
      # main is pinned to.
      - name: Use the stable API
        shell: bash
        run: scripts/use_stable_api.sh

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-${{ matrix.platform }}-

      - name: Build
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --lib --no-default-features --target "$target"
          done

      # The core ABI the plugin declares (CorePluginABIVersion) is
      # BN_CURRENT_CORE_ABI_VERSION of the stable binaryninjacore.h.
      - name: Package
        shell: bash
        run: |
          abi=$(cargo metadata --format-version 1 | python3 -c '
          import json, os, sys
          meta = json.load(sys.stdin)
          sys_crate = next(p for p in meta["packages"] if p["name"] == "binaryninjacore-sys")
          header = os.path.join(os.path.dirname(sys_crate["manifest_path"]), "..", "..", "binaryninjacore.h")
          print(next(l.split()[2] for l in open(header) if l.startswith("#define BN_CURRENT_CORE_ABI_VERSION ")))')
          name="binja_xtensa-abi${abi}-${{ matrix.platform }}"
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)
              cp target/x86_64-unknown-linux-gnu/release/libbinja_xtensa.so "dist/$name.so" ;;
            Windows)
              cp target/x86_64-pc-windows-msvc/release/binja_xtensa.dll "dist/$name.dll" ;;
            macOS)
              lipo -create \
                target/aarch64-apple-darwin/release/libbinja_xtensa.dylib \
                target/x86_64-apple-darwin/release/libbinja_xtensa.dylib \
                -output "dist/$name.dylib"
              lipo -info "dist/$name.dylib" ;;
          esac
          ls -l dist

      # Kept for the publish run, which must follow within the retention
      # period.
      - uses: actions/upload-artifact@v7
        with:
          name: binja_xtensa-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binja_xtensa-*
          merge-multiple: true

      # The input reaches the shell only through the environment.
      - name: Generate the manifest
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version=${VERSION_INPUT:-$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')}
          scripts/release_manifest.py generate dist \
            --version "$version" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" > manifest.json
          {
            echo "## Loader manifest for v$version"
            echo
            echo "Built from \`$GITHUB_SHA\`. To release:"
            echo
            echo "1. On top of \`$GITHUB_SHA\`, save this as \`binja_xtensa_loader/manifest.json\` (or download the \`manifest\` artifact) and set \`plugin.json\`'s version to \`$version\`; change nothing else."
            echo "2. Commit, push, tag the commit \`v$version\` and push the tag."
            echo "3. Run this workflow on the tag \`v$version\` with mode \`publish\`."
            echo
            echo '```json'
            cat manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: manifest.json
          if-no-files-found: error

  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To download the artifacts of the build run.
      actions: read
    env:
      TAG: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      - name: Check the dispatched ref is a version tag
        run: |
          if [ "$REF_TYPE" != tag ] || ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::publish must be dispatched on a vX.Y or vX.Y.Z tag, not $REF_TYPE '$TAG'"
            exit 1
          fi

      # The full history, to compare the tag with the build commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check plugin.json and the manifest are for the tag
        id: manifest
        run: |
          scripts/release_manifest.py check-tag "$TAG" > build.env
          cat build.env >> "$GITHUB_OUTPUT"
          cat build.env
          rm build.env

      - name: Check the tag is the build commit plus the release files
        env:
          BUILD_COMMIT: ${{ steps.manifest.outputs.commit }}
        run: scripts/release_manifest.py check-tree "$BUILD_COMMIT" "$TAG"

      - name: Check the build run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.manifest.outputs.run_id }}
          BUILD_COMMIT: ${{ steps.manifest.outputs.commit }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'EOF'
          import json, os, sys
          run = json.load(open("run.json"))
          problems = []
          if run["head_sha"] != os.environ["BUILD_COMMIT"]:
              problems.append("built {} not {}".format(run["head_sha"], os.environ["BUILD_COMMIT"]))
          if run["event"] != "workflow_dispatch":
              problems.append("was triggered by " + run["event"])
          if not run["path"].startswith(".github/workflows/release.yml"):
              problems.append("is a run of " + run["path"])
          if run["status"] != "completed" or run["conclusion"] != "success":
              problems.append("did not succeed ({} {})".format(run["status"], run["conclusion"]))
          if problems:
              sys.exit("error: build run {} {}".format(os.environ["RUN_ID"], "; ".join(problems)))
          print("build run {} built {}".format(os.environ["RUN_ID"], run["head_sha"]))
          EOF
          rm run.json

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binja_xtensa-*
          merge-multiple: true
          run-id: ${{ steps.manifest.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check the artifacts against the committed manifest
        run: scripts/release_manifest.py verify dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # --verify-tag makes gh fail if the tag doesn't exist on GitHub
        # instead of creating it from the default branch.
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" --generate-notes --verify-tag
