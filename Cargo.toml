[package]
name = "binja-xtensa"
version = "0.1.0"
edition = "2024"
description = "Binary Ninja plugin for Espressif chips: Xtensa architectures (ESP8266, ESP32, ESP32-S2, ESP32-S3) and Espressif firmware loading"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["core"]
# Link against the installed Binary Ninja core. Without it, a stub core library
# is built and linked instead, so the plugin builds where Binary Ninja is not
# installed (e.g. CI).
core = ["binaryninja/core", "binaryninjacore-sys/core"]

[dependencies]
binaryninja = { git = "https://github.com/Vector35/binaryninja-api.git", rev = "e144e59e578aa49fe3b332e970093ba44b3362b0", default-features = false }
binaryninjacore-sys = { git = "https://github.com/Vector35/binaryninja-api.git", rev = "e144e59e578aa49fe3b332e970093ba44b3362b0", default-features = false }
xtensa-isa = { package = "xtensa", git = "https://github.com/jrozner/xtensa.git", rev = "8a4d748d31e20ff669a1fa883a39c1e8473b21b8" }
tracing = "0.1"
serde_json = "1"
flate2 = "1"

[build-dependencies]
flate2 = "1"

