version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned to a binaryninja-api revision that must match the installed
      # Binary Ninja version; bump the rev in Cargo.toml by hand.
      - dependency-name: "binaryninja"
      - dependency-name: "binaryninjacore-sys"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
