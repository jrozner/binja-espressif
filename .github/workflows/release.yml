# DRAFT: never run on GitHub; review before relying on it.
#
# On a version tag (v<plugin.json version>), builds the plugin for Linux,
# Windows and macOS (universal) against the stable binaryninja-api release
# named in scripts/use_stable_api.sh (main's Cargo.toml pins a dev revision,
# which the script swaps out) and attaches the libraries to a GitHub
# release, one asset per platform and core ABI:
#
#   binja_xtensa-abi<N>-linux-x86_64.so
#   binja_xtensa-abi<N>-windows-x86_64.dll
#   binja_xtensa-abi<N>-macos-universal.dylib
#
# The extension manager (extensions.binary.ninja) does not deliver release
# assets: every platform gets the source zipball of the tagged commit, and
# only plugins whose `api` is python3 install. So a listing also needs a
# small Python loader in the repository that downloads the asset matching the
# running core's ABI (binaryninja.core.BNGetCurrentCoreABIVersion()) and
# platform into user_plugin_path() and asks for a restart. That loader is
# not written yet.
#
# The builds link a stub core generated by binaryninjacore-sys (the `core`
# feature is off), so no Binary Ninja installation or serial is needed. The
# stub has the real core's library name (libbinaryninjacore.so.1,
# binaryninjacore.dll, @rpath/libbinaryninjacore.1.dylib), and Binary Ninja
# loads its core before any plugin, so the plugin binds to the real core.

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            targets: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x86_64
            targets: x86_64-pc-windows-msvc
          # Both slices are built on the Apple silicon runner and joined
          # into one universal dylib.
          - os: macos-latest
            platform: macos-universal
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust
        shell: bash
        run: |
          rustup update stable --no-self-update && rustup default stable
          for target in ${{ matrix.targets }}; do rustup target add "$target"; done

      # The stub core is built with CMake (on every runner image) and Ninja;
      # bindgen needs libclang (on every runner image).
      - name: Install Ninja
        shell: bash
        run: |
          if ! command -v ninja >/dev/null; then
            case "$RUNNER_OS" in
              macOS) brew install ninja ;;
              Windows) choco install ninja --no-progress -y ;;
              Linux) sudo apt-get update && sudo apt-get install -y ninja-build ;;
            esac
          fi
          ninja --version

      # Release binaries target the stable Binary Ninja (6.0, core ABI 187),
      # not the dev API main is pinned to.
      - name: Use the stable API
        shell: bash
        run: scripts/use_stable_api.sh

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-${{ matrix.platform }}-

      - name: Build
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --lib --no-default-features --target "$target"
          done

      # The core ABI the plugin declares (CorePluginABIVersion) is
      # BN_CURRENT_CORE_ABI_VERSION of the stable binaryninjacore.h.
      - name: Package
        shell: bash
        run: |
          abi=$(cargo metadata --format-version 1 | python3 -c '
          import json, os, sys
          meta = json.load(sys.stdin)
          sys_crate = next(p for p in meta["packages"] if p["name"] == "binaryninjacore-sys")
          header = os.path.join(os.path.dirname(sys_crate["manifest_path"]), "..", "..", "binaryninjacore.h")
          print(next(l.split()[2] for l in open(header) if l.startswith("#define BN_CURRENT_CORE_ABI_VERSION ")))')
          name="binja_xtensa-abi${abi}-${{ matrix.platform }}"
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)
              cp target/x86_64-unknown-linux-gnu/release/libbinja_xtensa.so "dist/$name.so" ;;
            Windows)
              cp target/x86_64-pc-windows-msvc/release/binja_xtensa.dll "dist/$name.dll" ;;
            macOS)
              lipo -create \
                target/aarch64-apple-darwin/release/libbinja_xtensa.dylib \
                target/x86_64-apple-darwin/release/libbinja_xtensa.dylib \
                -output "dist/$name.dylib"
              lipo -info "dist/$name.dylib" ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: binja_xtensa-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The extension manager reads plugin.json at the latest release's tag
      # and only looks at its version, so the tag must carry the bumped one.
      - name: Check the plugin.json version matches the tag
        run: |
          version=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "plugin.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
