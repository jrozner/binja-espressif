# Builds and publishes the prebuilt native libraries that the Python loader
# (binja_xtensa_loader/) installs. Manual only (workflow_dispatch), in two
# runs, because a tag's source cannot contain the hashes of libraries built
# from that same tag:
#
# 1. mode=build, dispatched on a branch (normally main). Builds the
#    libraries of the dispatched commit for Linux, Windows and macOS
#    (universal) against the binaryninja-api chosen by the api input,
#    uploads them as workflow artifacts, and generates the loader's
#    manifest: version, build commit, this run's ID, the API built against,
#    and each library's name, core ABI, size and SHA-256. The manifest is
#    shown in the run summary and uploaded as the `manifest` artifact.
#
#    api=dev (the default) builds against the dev revision Cargo.toml pins,
#    for the Binary Ninja dev channel; api=stable builds against the stable
#    release named in scripts/use_stable_api.sh. The core ABI is in each
#    asset's name, so the publish run needs no api input.
#
# 2. The maintainer commits that manifest as binja_xtensa_loader/manifest.json
#    on top of the build commit (with plugin.json's version bumped, if it
#    wasn't already), and pushes a v<version> tag on that commit.
#
# 3. mode=publish, dispatched on that tag. Checks that plugin.json and the
#    committed manifest are for the tag, that the run named by the manifest
#    built the commit the manifest names, and that the tag's tree equals
#    that commit's apart from the manifest and plugin.json's version. It then
#    downloads that run's artifacts, checks them against the committed
#    manifest, and creates the release from exactly those files.
#
# The loader verifies every download against the manifest in the source the
# extension manager installed (the tag's), never against anything fetched
# from the release.
#
# Pre-releases: a version with a pre-release suffix (0.2.0-rc.1, tag
# v0.2.0-rc.1) goes through the same two runs, and its publish run must have
# the prerelease input set (and a final version's must not): the release is
# then marked as a pre-release and not as latest, so it is not what
# releases/latest returns. See "Testing a release privately" in the README.
#
# Assets, one per platform and core ABI:
#
#   binja_xtensa-abi<N>-linux-x86_64.so
#   binja_xtensa-abi<N>-windows-x86_64.dll
#   binja_xtensa-abi<N>-macos-universal.dylib
#
# The builds link a stub core generated by binaryninjacore-sys (the `core`
# feature is off), so no Binary Ninja installation or serial is needed. The
# stub has the real core's library name (libbinaryninjacore.so.1,
# binaryninjacore.dll, @rpath/libbinaryninjacore.1.dylib), and Binary Ninja
# loads its core before any plugin, so the plugin binds to the real core.

name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build: build the dispatched commit and generate the manifest. publish: publish the dispatched tag's release from its manifest's build run."
        required: true
        type: choice
        options:
          - build
          - publish
      version:
        description: "build only: the version being released (default: plugin.json's version), e.g. 0.2.0 or 0.2.0-rc.1"
        required: false
        type: string
      api:
        description: "build only: the binaryninja-api to build against. dev: the revision Cargo.toml pins (Binary Ninja dev channel). stable: the release in scripts/use_stable_api.sh."
        required: false
        type: choice
        default: dev
        options:
          - dev
          - stable
      prerelease:
        description: "publish only: publish a pre-release (required for, and only allowed for, a tag like v0.2.0-rc.1); it is not marked latest"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: inputs.mode == 'build'
    strategy:
      # One platform failing must not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            targets: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x86_64
            targets: x86_64-pc-windows-msvc
          # Both slices are built on the Apple silicon runner and joined
          # into one universal dylib.
          - os: macos-latest
            platform: macos-universal
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    # Every platform builds the same API, so whichever job sets it last is
    # as good as any.
    outputs:
      api_source: ${{ steps.package.outputs.api_source }}
    steps:
      # The dispatched commit, pinned by SHA so every job builds the same one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        shell: bash
        run: |
          rustup update stable --no-self-update && rustup default stable
          for target in ${{ matrix.targets }}; do rustup target add "$target"; done

      # binaryninja-api's vendor/bindiff submodule has paths longer than
      # Windows' 260-character limit, which cargo's git (libgit2) refuses to
      # check out unless core.longpaths is set. A short CARGO_HOME keeps the
      # checkout's paths under the limit as well. It is set only after
      # rustup has run, so rustup's proxies stay in ~/.cargo/bin, which is on
      # PATH; it moves only cargo's registry and git caches.
      - name: Configure Cargo
        id: cargo
        shell: bash
        run: |
          home=~/.cargo
          if [ "$RUNNER_OS" = Windows ]; then
            git config --global core.longpaths true
            home=C:/c
            echo "CARGO_HOME=$home" >> "$GITHUB_ENV"
          fi
          echo "home=$home" >> "$GITHUB_OUTPUT"

      # The stub core is built with CMake (on every runner image) and Ninja;
      # bindgen needs libclang (on every runner image).
      - name: Install Ninja
        shell: bash
        run: |
          if ! command -v ninja >/dev/null; then
            case "$RUNNER_OS" in
              macOS) brew install ninja ;;
              Windows) choco install ninja --no-progress -y ;;
              Linux) sudo apt-get update && sudo apt-get install -y ninja-build ;;
            esac
          fi
          ninja --version

      # api=dev builds Cargo.toml's pin as it is. The input reaches the
      # shell only through the environment.
      - name: Use the stable API
        if: inputs.api == 'stable'
        shell: bash
        run: scripts/use_stable_api.sh

      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.cargo.outputs.home }}/registry/index
            ${{ steps.cargo.outputs.home }}/registry/cache
            ${{ steps.cargo.outputs.home }}/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ matrix.platform }}-${{ inputs.api }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-${{ matrix.platform }}-${{ inputs.api }}-

      - name: Build
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --lib --no-default-features --target "$target"
          done

      # The core ABI the plugin declares (CorePluginABIVersion) is
      # BN_CURRENT_CORE_ABI_VERSION of the binaryninjacore.h built against.
      - name: Package
        id: package
        shell: bash
        env:
          API: ${{ inputs.api }}
        run: |
          cargo metadata --format-version 1 | python3 -c '
          import json, os, sys
          meta = json.load(sys.stdin)
          sys_crate = next(p for p in meta["packages"] if p["name"] == "binaryninjacore-sys")
          header = os.path.join(os.path.dirname(sys_crate["manifest_path"]), "..", "..", "binaryninjacore.h")
          print(next(l.split()[2] for l in open(header) if l.startswith("#define BN_CURRENT_CORE_ABI_VERSION ")))
          print(sys_crate["source"])' | tr -d '\r' > api.txt
          { read -r abi; read -r source; } < api.txt
          rm api.txt
          if ! [[ "$abi" =~ ^[0-9]+$ ]] || [ -z "$source" ]; then
            echo "::error::could not read the core ABI and binaryninja-api source (got '$abi', '$source')"
            exit 1
          fi
          echo "api_source=$source" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.platform }}: core ABI $abi, binaryninja-api $API ($source)" >> "$GITHUB_STEP_SUMMARY"
          name="binja_xtensa-abi${abi}-${{ matrix.platform }}"
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)
              cp target/x86_64-unknown-linux-gnu/release/libbinja_xtensa.so "dist/$name.so" ;;
            Windows)
              cp target/x86_64-pc-windows-msvc/release/binja_xtensa.dll "dist/$name.dll" ;;
            macOS)
              lipo -create \
                target/aarch64-apple-darwin/release/libbinja_xtensa.dylib \
                target/x86_64-apple-darwin/release/libbinja_xtensa.dylib \
                -output "dist/$name.dylib"
              lipo -info "dist/$name.dylib" ;;
          esac
          ls -l dist

      # Kept for the publish run, which must follow within the retention
      # period.
      - uses: actions/upload-artifact@v7
        with:
          name: binja_xtensa-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binja_xtensa-*
          merge-multiple: true

      # The input reaches the shell only through the environment.
      - name: Generate the manifest
        env:
          VERSION_INPUT: ${{ inputs.version }}
          API: ${{ inputs.api }}
          API_SOURCE: ${{ needs.build.outputs.api_source }}
        run: |
          version=${VERSION_INPUT:-$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')}
          scripts/release_manifest.py generate dist \
            --version "$version" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --api "$API" --api-source "$API_SOURCE" > manifest.json
          {
            echo "## Loader manifest for v$version"
            echo
            echo "Built from \`$GITHUB_SHA\` against the $API binaryninja-api (\`$API_SOURCE\`). To release:"
            echo
            echo "1. On top of \`$GITHUB_SHA\`, save this as \`binja_xtensa_loader/manifest.json\` (or download the \`manifest\` artifact) and set \`plugin.json\`'s version to \`$version\`; change nothing else."
            if [[ "$version" == *-* ]]; then
              echo "2. Commit on a branch (not \`main\`), tag the commit \`v$version\` and push the tag."
              echo "3. Run this workflow on the tag \`v$version\` with mode \`publish\` and \`prerelease\` checked."
            else
              echo "2. Commit, push, tag the commit \`v$version\` and push the tag."
              echo "3. Run this workflow on the tag \`v$version\` with mode \`publish\`."
            fi
            echo
            echo '```json'
            cat manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: manifest.json
          if-no-files-found: error

  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To download the artifacts of the build run.
      actions: read
    env:
      TAG: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      # check-tag checks the tag's version in full, including that it is a
      # pre-release version exactly when the prerelease input is set.
      - name: Check the dispatched ref is a version tag
        run: |
          if [ "$REF_TYPE" != tag ] || ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::publish must be dispatched on a vX.Y, vX.Y.Z or vX.Y.Z-<pre-release> tag, not $REF_TYPE '$TAG'"
            exit 1
          fi

      # The full history, to compare the tag with the build commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check plugin.json and the manifest are for the tag
        id: manifest
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          scripts/release_manifest.py check-tag "$TAG" "${prerelease[@]}" > build.env
          cat build.env >> "$GITHUB_OUTPUT"
          cat build.env
          rm build.env

      - name: Check the tag is the build commit plus the release files
        env:
          BUILD_COMMIT: ${{ steps.manifest.outputs.commit }}
        run: scripts/release_manifest.py check-tree "$BUILD_COMMIT" "$TAG"

      - name: Check the build run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.manifest.outputs.run_id }}
          BUILD_COMMIT: ${{ steps.manifest.outputs.commit }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'EOF'
          import json, os, sys
          run = json.load(open("run.json"))
          problems = []
          if run["head_sha"] != os.environ["BUILD_COMMIT"]:
              problems.append("built {} not {}".format(run["head_sha"], os.environ["BUILD_COMMIT"]))
          if run["event"] != "workflow_dispatch":
              problems.append("was triggered by " + run["event"])
          if not run["path"].startswith(".github/workflows/release.yml"):
              problems.append("is a run of " + run["path"])
          if run["status"] != "completed" or run["conclusion"] != "success":
              problems.append("did not succeed ({} {})".format(run["status"], run["conclusion"]))
          if problems:
              sys.exit("error: build run {} {}".format(os.environ["RUN_ID"], "; ".join(problems)))
          print("build run {} built {}".format(os.environ["RUN_ID"], run["head_sha"]))
          EOF
          rm run.json

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binja_xtensa-*
          merge-multiple: true
          run-id: ${{ steps.manifest.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check the artifacts against the committed manifest
        run: scripts/release_manifest.py verify dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # --verify-tag makes gh fail if the tag doesn't exist on GitHub
        # instead of creating it from the default branch. A pre-release is
        # never marked latest.
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" dist/* \
            --title "$TAG" --generate-notes --verify-tag "${flags[@]}"
