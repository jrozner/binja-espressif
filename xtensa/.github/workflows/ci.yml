name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.87 is the minimum supported Rust version (rust-version in Cargo.toml).
        toolchain: [stable, beta, "1.87"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup override set "$TOOLCHAIN"
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
      # The exhaustive tests take many CPU-minutes; nightly.yml runs them.
      - run: cargo test --locked --all-targets -- --skip exhaustive
      - run: cargo test --locked --doc

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup override set stable
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
