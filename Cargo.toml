[package]
name = "binja-xtensa"
version = "0.1.0"
edition = "2024"
description = "Binary Ninja plugin for Espressif chips: Xtensa architectures (ESP8266, ESP32, ESP32-S2, ESP32-S3) and Espressif firmware loading"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
binaryninja = { git = "https://github.com/Vector35/binaryninja-api.git", branch = "dev" }
binaryninjacore-sys = { git = "https://github.com/Vector35/binaryninja-api.git", branch = "dev" }
xtensa-isa = { package = "xtensa", git = "https://github.com/jrozner/xtensa.git", branch = "main" }
tracing = "0.1"
serde_json = "1"
flate2 = "1"

[build-dependencies]
flate2 = "1"

