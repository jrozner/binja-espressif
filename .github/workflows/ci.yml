name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Without the `core` feature, binaryninjacore-sys builds a stub core library
# with CMake and Ninja (both on the runner image) in place of a Binary Ninja
# install.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Build
        run: cargo build --workspace --no-default-features --all-targets

      # The liftcheck feature's lift sweep needs a licensed Binary Ninja
      # core, so it is only linted (below), not run.
      - name: Test
        run: cargo test -p binja-xtensa -p arch_xtensa --no-default-features --lib

      # The plugins in arch/ and view/ also build on their own, exporting
      # their own entry points. A workspace build has their `bundled` feature
      # on (the root package's dependency enables it), so this builds each
      # one alone.
      - name: Build the plugins on their own
        run: |
          cargo build -p arch_xtensa --no-default-features
          nm -D --defined-only target/debug/libarch_xtensa.so | grep -w CorePluginInit

  # The decoder (xtensa/) on its own, also on its minimum supported Rust
  # version (rust-version in xtensa/Cargo.toml). The exhaustive tests take
  # many CPU-minutes; nightly.yml runs them.
  decoder:
    name: decoder (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, "1.87"]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup override set "$TOOLCHAIN"

      # Cargo resolves the whole workspace, so this fetches the plugin's
      # dependencies too (without building them).
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-${{ matrix.toolchain }}-

      - name: Test
        run: |
          cargo test -p xtensa --locked --all-targets -- --skip exhaustive
          cargo test -p xtensa --locked --doc

      - name: Docs
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p xtensa --locked --no-deps

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --no-default-features --all-targets -- -D warnings
          cargo clippy -p arch_xtensa --no-default-features --features liftcheck --all-targets -- -D warnings
          cargo clippy -p arch_xtensa --no-default-features --all-targets -- -D warnings

  # The Python loader (binja_xtensa_loader/), the release manifest tooling
  # and scripts/fetch_rom_elfs.py; standard library only, no Binary Ninja
  # needed.
  loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: python3 tests/test_loader.py -v

      - name: Test fetch_rom_elfs.py
        run: python3 tests/test_fetch_rom_elfs.py -v

  # main and releases build against the binaryninja-api dev revision pinned
  # in Cargo.toml. This checks that the code still builds and passes against
  # the stable API, which the release workflow builds with api=stable.
  stable-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup component add clippy

      - name: Use the stable API
        run: scripts/use_stable_api.sh

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Build
        run: cargo build --no-default-features

      - name: Clippy
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      - name: Test
        run: cargo test -p binja-xtensa -p arch_xtensa --no-default-features --lib
