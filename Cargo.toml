[package]
name = "binja-xtensa"
version = "0.1.0"
edition = "2024"
description = "Binary Ninja plugin for Espressif chips: Xtensa architectures (ESP8266, ESP32, ESP32-S2, ESP32-S3) and Espressif firmware loading"
license = "MIT"
publish = false

# The root package is the plugin the release ships: one library that
# registers the plugins in arch/ and view/, linked in as Rust libraries (with
# their `bundled` feature). Each of those is also a Binary Ninja plugin of
# its own, shaped like the Rust plugins in the binaryninja-api tree.
# xtensa/ is the instruction decoder.
[workspace]
members = [".", "xtensa", "arch/xtensa", "arch/riscv_ilp32", "view/espressif"]

[workspace.dependencies]
binaryninja = { git = "https://github.com/Vector35/binaryninja-api.git", rev = "f15f46d6517159243a6907674dcc1170f10fb0d3", default-features = false }
binaryninjacore-sys = { git = "https://github.com/Vector35/binaryninja-api.git", rev = "f15f46d6517159243a6907674dcc1170f10fb0d3", default-features = false }
xtensa-isa = { package = "xtensa", path = "xtensa" }
arch_xtensa = { path = "arch/xtensa", default-features = false }
arch_riscv_ilp32 = { path = "arch/riscv_ilp32", default-features = false }
view_espressif = { path = "view/espressif", default-features = false }

[lib]
crate-type = ["cdylib"]

[features]
default = ["core"]
# Link against the installed Binary Ninja core. Without it, a stub core library
# is built and linked instead, so the plugin builds where Binary Ninja is not
# installed (e.g. CI).
core = [
    "binaryninja/core",
    "binaryninjacore-sys/core",
    "arch_xtensa/core",
    "arch_riscv_ilp32/core",
    "view_espressif/core",
]

[dependencies]
binaryninja.workspace = true
binaryninjacore-sys.workspace = true
arch_xtensa = { workspace = true, features = ["bundled"] }
arch_riscv_ilp32 = { workspace = true, features = ["bundled"] }
view_espressif = { workspace = true, features = ["bundled"] }

